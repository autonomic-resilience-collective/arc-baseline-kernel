# render.yaml — IHB State Service deployment
# Reconciled with ihb_payment.py and ihb_mcp_server.py env var names

services:
  - type: web
    name: ihb-mcp-payment-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── REQUIRED: set in Render dashboard, never commit ──
      - key: ARC_USDC_WALLET
        sync: false
        description: "Base L2 USDC receiving address for x402 payments"

      # ── Network ──
      - key: BASE_L2_RPC
        value: "https://mainnet.base.org"
      - key: SERVICE_URL
        fromService:
          type: web
          name: ihb-mcp-payment-gateway
          property: host
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: "production"
      - key: PYTHONUNBUFFERED
        value: "1"

      # ── Zero-fabrication enforcement flag ──
      - key: ENFORCE_ZERO_FABRICATION
        value: "true"


      # ── Nevermined SDK (fiat + x402 bridge) ──
      - key: NVM_API_KEY
        sync: false
        description: "Nevermined API key from app.nevermined.app → Settings → API Keys"
      - key: NVM_ENVIRONMENT
        value: "live"
      - key: NVM_AGENT_ID
        sync: false
        description: "IHB agent DID from Nevermined dashboard after registering agent"
      - key: NVM_PLAN_MICRO
        sync: false
        description: "Nevermined plan ID for micro tier ($0.02/call)"
      - key: NVM_PLAN_BATCH
        sync: false
        description: "Nevermined plan ID for batch tier ($50/5000 calls)"
      - key: NVM_PLAN_FLEET
        sync: false
        description: "Nevermined plan ID for fleet tier ($3000/month)"
      - key: NVM_PLAN_HIGH_STAKES
        sync: false
        description: "Nevermined plan ID for high-stakes tier ($500+ base fee)"
      # ── Base pricing (USDC) ──
      - key: USDC_PER_QUERY
        value: "0.02"
      - key: CUSTOM_MAPPING_PRICE
        value: "0.50"
      - key: MULTISTREAM_PRICE_PER_EXTRA
        value: "0.10"

      # ── verify_agent_action tier pricing ──
      - key: VERIFY_PRICE_STANDARD
        value: "1.00"
      - key: VERIFY_PRICE_ELEVATED
        value: "2.50"
      - key: VERIFY_PRICE_HIGH_STAKES
        value: "5.00"

      # ── Dynamic value-based pricing rate ──
      - key: VALUE_BASED_RATE
        value: "0.0005"

      # ── Historical report pricing ──
      - key: REPORT_PRICE_CHAPTER
        value: "25.00"
      - key: REPORT_PRICE_DEEP
        value: "50.00"
