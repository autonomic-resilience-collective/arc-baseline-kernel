name: IHB vNext CI

on:
  push:
    branches: [ihb-vnext-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Import combined v1+v2 service
        run: python -c "from ihb_vnext_service import app; print(app.title)"
